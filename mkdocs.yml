site_name: Full-stack từ số 0 đến Software Architect
docs_dir: fullstack-roadmap
repo_url: https://github.com/Xuanthanh-dzz/full-stack
edit_uri: edit/main/fullstack-roadmap/
theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Nền tối }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Nền sáng }
  features: [navigation.instant, navigation.tracking, navigation.top, navigation.indexes, toc.follow, search.suggest, search.highlight, content.code.copy]
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true }
plugins:
  - search
  - awesome-pages
not_in_nav: |
  PROGRESS.md
exclude_docs: |
  PROMPT.md
  index.md
