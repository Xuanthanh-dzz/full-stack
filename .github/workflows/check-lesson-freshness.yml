name: Check lesson freshness

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fullstack-roadmap/01-nen-tang-lap-trinh/**"
      - "fullstack-roadmap/02-c-chuyen-sau/**"
      - "fullstack-roadmap/03-cpp/**"
      - "fullstack-roadmap/09-linq-va-ef-core/**"
      - "fullstack-roadmap/10-web-nen-tang/**"
      - "fullstack-roadmap/11-aspnet-core-backend/**"
      - "fullstack-roadmap/12-frontend/**"
      - "fullstack-roadmap/13-fullstack-tich-hop/**"
      - "fullstack-roadmap/14-testing-va-chat-luong/**"
      - "fullstack-roadmap/15-devops/**"
      - "fullstack-roadmap/16-design-patterns/**"
      - "fullstack-roadmap/17-kien-truc/**"
      - "fullstack-roadmap/18-system-design/**"
      - "fullstack-roadmap/19-cong-nghe-hien-dai/**"
      - "fullstack-roadmap/20-ky-nang-architect/**"
      - "fullstack-roadmap/21-du-an/**"
      - "scripts/check_lesson_freshness.py"
      - "scripts/verify_retrofit_v4.py"
      - ".github/workflows/check-lesson-freshness.yml"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check last-verified metadata
        run: python scripts/check_lesson_freshness.py --start-module 9

      - name: Check activated retrofit freshness and clarity
        run: |
          python scripts/verify_retrofit_v4.py 01
          python scripts/verify_retrofit_v4.py 02
          python scripts/verify_retrofit_v4.py 03
