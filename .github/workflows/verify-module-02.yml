name: Verify Module 02 clarity v4
on:
  push:
    paths:
      - 'fullstack-roadmap/02-c-chuyen-sau/**'
      - 'fullstack-roadmap/00-huong-dan/**'
      - 'fullstack-roadmap/PROGRESS.md'
      - 'scripts/verify_module_02.py'
      - 'scripts/verify_module_01.py'
      - 'scripts/verify_retrofit_v4.py'
      - 'scripts/tests/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/verify-module-02.yml'
  pull_request:
    paths:
      - 'fullstack-roadmap/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/verify-module-02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - name: Gate regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Published C11 programs, contracts and Failure Labs
        run: python scripts/verify_module_02.py --report artifacts/module02.json
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: python scripts/verify_module_02.py --sanitize --report artifacts/module02-sanitizers.json
      - name: Strict documentation build
        run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module02-verification
          path: artifacts/*.json
          if-no-files-found: warn
