name: Preview docs for PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies from main
        run: python -m pip install -r main-src/requirements-docs.txt

      - name: Build production root from main
        run: |
          mkdocs build \
            -f main-src/mkdocs.yml \
            -d "$GITHUB_WORKSPACE/site"

      - name: Build previews with latest main UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/site/pr-preview"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.sha, .head.repo.full_name] | @tsv' \
            > "$RUNNER_TEMP/open-prs.tsv"

          while IFS=$'\t' read -r number sha head_repo; do
            [ -n "$number" ] || continue
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || continue

            workdir="$RUNNER_TEMP/pr-$number"
            assembled="$RUNNER_TEMP/assembled-pr-$number"
            target="$GITHUB_WORKSPACE/site/pr-preview/pr-$number"

            rm -rf "$workdir" "$assembled" "$target"

            echo "Building PR #$number"
            echo "  UI      : latest main"
            echo "  Content : $sha"

            if ! git -C main-src fetch --no-tags --depth=1 origin "$sha"; then
              echo "::warning::Could not fetch PR #$number; skipping preview"
              continue
            fi

            if ! git -C main-src worktree add --detach "$workdir" "$sha"; then
              echo "::warning::Could not create worktree for PR #$number; skipping preview"
              continue
            fi

            if ! python main-src/scripts/build_pr_preview.py \
              --main main-src \
              --pr "$workdir" \
              --out "$assembled"; then
              echo "::warning::Could not assemble PR #$number; skipping preview"
              git -C main-src worktree remove "$workdir" --force || true
              continue
            fi

            if ! mkdocs build -f "$assembled/mkdocs.yml" -d "$target"; then
              echo "::warning::MkDocs build failed for PR #$number; skipping preview"
              rm -rf "$target"
            fi

            git -C main-src worktree remove "$workdir" --force || true
            rm -rf "$assembled"
          done < "$RUNNER_TEMP/open-prs.tsv"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

    steps:
      - name: Deploy production root + all open PR previews
        id: deployment
        uses: actions/deploy-pages@v4
