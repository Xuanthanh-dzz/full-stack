name: Preview docs for PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install -r pr-src/requirements-docs.txt

      - name: Build production root from main
        run: |
          mkdocs build \
            -f main-src/mkdocs.yml \
            -d "$GITHUB_WORKSPACE/site"

      - name: Build PR preview
        run: |
          mkdocs build \
            -f pr-src/mkdocs.yml \
            -d "$GITHUB_WORKSPACE/site/pr-preview/pr-${{ github.event.number }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

    steps:
      - name: Deploy production root + PR preview
        id: deployment
        uses: actions/deploy-pages@v4
